[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Revalidate on every visit so CSS/JS changes show up right after a deploy
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The CMS must never be cached or indexed
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

# Reader sign-in runs on the site's own domain: Firebase's auth pages are proxied here,
# so browsers that partition storage between sites (Safari, in-app browsers) don't lose the sign-in state.
[[redirects]]
  from = "/__/auth/*"
  to = "https://wvsu-jla.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://wvsu-jla.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

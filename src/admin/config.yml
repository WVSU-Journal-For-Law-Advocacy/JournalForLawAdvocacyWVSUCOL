# Decap CMS: editors sign in at /admin with a GitHub account that has
# write access to the repository. Every save is a commit to main,
# which makes Netlify rebuild the site (about a minute).
backend:
  name: github
  repo: elmoadorjr/JournalForLawAdvocacyWVSUCOL
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://journalforlawadvocacy.netlify.app
logo_url: /assets/img/seal-240.png
media_folder: src/uploads
public_folder: /uploads

collections:
  - name: articles
    label: Articles
    label_singular: Article
    description: One entry per article. Upload the PDF and fill in where it appears in the journal.
    folder: src/articles
    create: true
    slug: "{{slug}}"
    summary: "Vol. {{volume}}, No. {{issue}}, p. {{first_page}} · {{title}}"
    sortable_fields: [title, volume, issue, first_page]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: "Author(s)", name: author, widget: string, hint: "Separate multiple authors with “and”." }
      # Keep these lists in step with Site settings → Areas of law / Kinds
      - label: Area of law
        name: area
        widget: select
        options: ["Constitutional law", "Criminal law", "Civil law", "Remedial law", "Legal ethics"]
      - label: Kind
        name: kind
        widget: select
        options: ["Article", "Essay", "Comment", "Student note", "Case comment"]
      - { label: Volume, name: volume, widget: number, value_type: int, min: 1 }
      - { label: Issue, name: issue, widget: number, value_type: int, min: 1 }
      - { label: Year, name: year, widget: number, value_type: int, min: 2021 }
      - { label: First page, name: first_page, widget: number, value_type: int, min: 1 }
      - { label: PDF, name: pdf, widget: file, required: false, hint: "Upload the final PDF of the article." }
      - { label: Keywords, name: keywords, widget: list, required: false, hint: "Separate with commas." }
      - { label: Abstract, name: abstract, widget: text }
      - { label: Draft (hide from the site), name: draft, widget: boolean, default: false, required: false }
      - { label: Full text (optional), name: body, widget: markdown, required: false, hint: "Leave empty if readers should use the PDF." }

  - name: issues
    label: Issues
    label_singular: Issue
    description: One entry per issue. Articles are listed under the issue with the same volume and issue number.
    folder: src/issues
    create: true
    slug: "volume-{{volume}}-issue-{{issue}}"
    summary: "{{title}} ({{status}})"
    fields:
      - { label: Title, name: title, widget: string, hint: "e.g. Volume 1, Issue 2" }
      - { label: Volume, name: volume, widget: number, value_type: int, min: 1 }
      - { label: Issue, name: issue, widget: number, value_type: int, min: 1 }
      - { label: Academic year, name: academic_year, widget: string, hint: "e.g. 2026–2027" }
      - label: Status
        name: status
        widget: select
        options:
          - { label: "Current (shown on the home page)", value: current }
          - { label: Published, value: published }
          - { label: Forthcoming, value: forthcoming }
        hint: "Only one issue should be Current. Change the old one to Published."
      - { label: Full issue PDF, name: pdf, widget: file, required: false }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About the journal
        file: src/about.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: layouts/page.njk }
          - { label: Permalink, name: permalink, widget: hidden, default: /about/ }
          - { label: Title, name: title, widget: string }
          - { label: Search description, name: description, widget: string }
          - { label: Quotation, name: quote, widget: text, required: false }
          - { label: Quotation source, name: quote_by, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - name: guidelines
        label: Submission guidelines
        file: src/_data/guidelines.json
        fields:
          - { label: Introduction, name: intro, widget: string }
          - label: Sections
            name: items
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
      - name: board
        label: Editorial board
        file: src/_data/board.json
        fields:
          - label: Members
            name: members
            widget: list
            summary: "{{fields.role}}: {{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Detail, name: detail, widget: string, required: false, hint: "e.g. Juris Doctor candidate" }

  - name: settings
    label: Settings
    files:
      - name: site
        label: Site settings
        file: src/_data/site.json
        fields:
          - { label: Journal name, name: title, widget: string }
          - { label: Citation abbreviation, name: short, widget: string, hint: "Used in citations, e.g. J. Law Advoc." }
          - { label: Institution, name: institution, widget: string }
          - { label: City, name: city, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Site address, name: url, widget: string, hint: "No trailing slash. Change this when you add a custom domain." }
          - { label: Contact email, name: email, widget: string }
          - { label: Academic year, name: academic_year, widget: string }
          - { label: Announcement banner, name: announcement, widget: string, required: false, hint: "Leave empty to hide the banner." }
          - { label: Submission deadline, name: deadline, widget: string, required: false }
          - { label: Areas of law, name: areas, widget: list, hint: "Also update the list in the Article form (ask the web admin)." }
          - { label: Kinds of work, name: kinds, widget: list }
          - { label: Facebook page URL, name: facebook, widget: string, required: false }
          - { label: Instagram URL, name: instagram, widget: string, required: false }

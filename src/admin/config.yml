# Decap CMS: editors sign in at /admin with a GitHub account that has
# write access to the repository. Every save is a commit to main,
# which makes Netlify rebuild the site (about a minute).
backend:
  name: github
  repo: elmoadorjr/JournalForLawAdvocacyWVSUCOL
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://journalforlawadvocacy.netlify.app
logo_url: /assets/img/seal-240.png
media_folder: src/uploads
public_folder: /uploads

collections:
  - name: articles
    label: Articles
    label_singular: Article
    description: One entry per article. Upload the article's own PDF and say where it appears in the volume.
    folder: src/articles
    create: true
    slug: "{{slug}}"
    summary: "Vol. {{volume}} · {{title}}"
    sortable_fields: [title, volume, first_page]
    media_folder: /src/uploads/articles
    public_folder: /uploads/articles
    fields:
      - { label: Title, name: title, widget: string }
      - { label: "Author(s)", name: author, widget: string, hint: "Separate multiple authors with “and”." }
      # Keep these lists in step with Site settings → Areas of law / Kinds of work
      - label: Area of law
        name: area
        widget: select
        options: ["Constitutional law", "Privacy and data protection", "Technology and the law", "Election law", "Criminal law", "Environmental law", "Civil law", "Taxation", "Legal ethics and the profession"]
      - label: Kind
        name: kind
        widget: select
        options: ["Article", "Essay", "Comment", "Editorial", "Student note"]
      - { label: Volume, name: volume, widget: number, value_type: int, min: 1 }
      - { label: Issue, name: issue, widget: hidden, default: 1 }
      - { label: Year published, name: year, widget: number, value_type: int, min: 2021 }
      - { label: First page (printed), name: first_page, widget: number, value_type: int, min: 1, required: false, hint: "The page number printed in the volume. Used in the citation." }
      - { label: Last page (printed), name: last_page, widget: number, value_type: int, min: 1, required: false }
      - { label: DOI, name: doi, widget: string, required: false, hint: "Only the DOI itself, e.g. 10.12345/jla.2025.5.96 (no https://doi.org/). Leave empty until registered." }
      - { label: Page in the volume PDF, name: pdf_page, widget: number, value_type: int, min: 1, required: false, hint: "Where the article starts in the full-volume PDF file, for the “View in the original volume” link. Often differs from the printed page." }
      - { label: Order, name: order, widget: number, value_type: int, required: false, hint: "Only for volumes without page numbers: position in the table of contents." }
      - { label: Article PDF, name: pdf, widget: file, required: false, hint: "The PDF of this article alone." }
      - { label: Keywords, name: keywords, widget: list, required: false, hint: "Separate with commas." }
      - { label: Abstract, name: abstract, widget: text }
      - { label: Draft (hide from the site), name: draft, widget: boolean, default: false, required: false }
      - { label: Full text (optional), name: body, widget: markdown, required: false, hint: "Leave empty if readers should use the PDF." }

  - name: issues
    label: Volumes
    label_singular: Volume
    description: One entry per volume. Articles with the same volume number are listed under it.
    folder: src/issues
    create: true
    slug: "volume-{{volume}}"
    summary: "{{title}} · {{academic_year}} ({{status}})"
    media_folder: /src/uploads/volumes
    public_folder: /uploads/volumes
    fields:
      - { label: Title, name: title, widget: string, hint: "e.g. Volume 6" }
      - { label: Volume, name: volume, widget: number, value_type: int, min: 1 }
      - { label: Issue, name: issue, widget: hidden, default: 1 }
      - { label: Academic year, name: academic_year, widget: string, hint: "e.g. 2026–2027" }
      - { label: Theme, name: theme, widget: string, required: false, hint: "Optional, e.g. The Inaugural Issue" }
      - label: Status
        name: status
        widget: select
        options:
          - { label: "Current (shown on the home page)", value: current }
          - { label: Published, value: published }
          - { label: Forthcoming, value: forthcoming }
        hint: "Only one volume should be Current. Change the old one to Published."
      - { label: Full volume PDF (original), name: pdf, widget: file, required: false, hint: "The complete volume exactly as published." }

  - name: policies
    label: Policies
    label_singular: Policy
    description: Journal policies (peer review, ethics, open access, copyright, citation). Untick “Show draft notice” once the board approves a policy.
    folder: src/policies
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: string }
      - { label: Order, name: order, widget: number, value_type: int }
      - { label: Show draft notice, name: draft_notice, widget: boolean, default: true, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About the journal
        file: src/about.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: layouts/page.njk }
          - { label: Permalink, name: permalink, widget: hidden, default: /about/ }
          - { label: Title, name: title, widget: string }
          - { label: Search description, name: description, widget: string }
          - { label: Quotation, name: quote, widget: text, required: false }
          - { label: Quotation source, name: quote_by, widget: string, required: false }
          - { label: Banner image, name: image, widget: image, required: false }
          - { label: Banner description (for screen readers), name: image_alt, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - name: guidelines
        label: Submission guidelines
        file: src/_data/guidelines.json
        fields:
          - { label: Introduction, name: intro, widget: string }
          - label: Sections
            name: items
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
      - name: board
        label: Editorial board
        file: src/_data/board.json
        media_folder: /src/assets/img/board
        public_folder: /assets/img/board
        fields:
          - label: Boards by academic year
            name: boards
            widget: list
            hint: "Newest year first. The first entry is shown as the current board; the rest appear under Past boards."
            summary: "AY {{fields.academic_year}}"
            fields:
              - { label: Academic year, name: academic_year, widget: string, hint: "e.g. 2026–2027" }
              - { label: Groups (in display order), name: groups, widget: list }
              - label: Members
                name: members
                widget: list
                summary: "{{fields.group}} · {{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Group, name: group, widget: string, hint: "Must match one of the groups above exactly." }
                  - { label: Photo, name: photo, widget: image, required: false, hint: "Square photo, at least 320 × 320 pixels." }
                  - { label: Detail, name: detail, widget: string, required: false }

  - name: settings
    label: Settings
    files:
      - name: site
        label: Site settings
        file: src/_data/site.json
        fields:
          - { label: Journal name, name: title, widget: string }
          - { label: Citation abbreviation, name: short, widget: string, hint: "Used in citations, e.g. J. Law Advoc." }
          - { label: Institution, name: institution, widget: string }
          - { label: City, name: city, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Site address, name: url, widget: string, hint: "No trailing slash. Change this when you add a custom domain." }
          - { label: Contact email, name: email, widget: string }
          - { label: Academic year, name: academic_year, widget: string }
          - { label: Announcement banner, name: announcement, widget: string, required: false, hint: "Leave empty to hide the banner." }
          - { label: Submission deadline, name: deadline, widget: string, required: false }
          - { label: Areas of law, name: areas, widget: list, hint: "Also update the list in the Article form (ask the web admin)." }
          - { label: Kinds of work, name: kinds, widget: list }
          - { label: ISSN (print), name: issn_print, widget: string, required: false, hint: "Shown in the footer and article metadata once assigned." }
          - { label: ISSN (online), name: issn_online, widget: string, required: false }
          - { label: GoatCounter code, name: goatcounter, widget: string, required: false, hint: "The part before .goatcounter.com, e.g. jla. Leave empty to turn analytics off." }
          - { label: Facebook page URL, name: facebook, widget: string, required: false }
          - { label: Instagram URL, name: instagram, widget: string, required: false }
